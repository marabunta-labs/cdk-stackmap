<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamic Stack Physics with Filter and Zoom</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #1e1e1e;
    color: #ccc;
    font-family: Segoe UI, sans-serif;
    overflow: hidden;
}

svg {
    width: 100%;
    height: 100%;
    cursor: grab;
}

/* Stacks visual */
.group-rect {
    fill: rgba(255,255,255,0.04);
    stroke: #aaa;
    stroke-width: 2;
    stroke-dasharray: 6 3;
    rx: 8;
}

.group-label {
    fill: #aaa;
    font-size: 13px;
    font-weight: bold;
}

.node rect {
    fill: #3c3c3c;
    stroke: #000;
    rx: 4;
}

.node text {
    fill: #eee;
    font-size: 11px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

/* Panel flotante */
#stack-button {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #007acc;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 1000;
    font-weight: bold;
}

#stack-panel {
    position: absolute;
    top: 60px;
    right: 20px;
    background: #252526;
    border: 1px solid #444;
    padding: 10px;
    border-radius: 6px;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    z-index: 1000;
}

.stack-item {
    margin-bottom: 5px;
    font-size: 13px;
}
</style>
</head>

<body>
<div id="graph"></div>

<!-- Botón flotante -->
<button id="stack-button">Stacks 0/0</button>
<div id="stack-panel"></div>

<script>
try {
    const rawData = {{graphData}}; // Tus datos reales

    // ----------------------------
    // 1. NODOS Y STACKS
    // ----------------------------
    const nodes = [];
    const stackNodes = [];
    const stacks = {};

    rawData.nodes.forEach(n => {
        const d = n.data;
        if (d.parent) {
            const w = Math.max(100, (d.label || d.id).length * 8);
            const h = 32;
            const node = {
                id: d.id,
                label: d.label || d.id,
                parent: d.parent,
                width: w,
                height: h,
                collisionRadius: Math.sqrt(w*w + h*h)/2
            };
            nodes.push(node);
            if (!stacks[d.parent]) stacks[d.parent] = [];
            stacks[d.parent].push(node);
        } else {
            stackNodes.push({
                id: d.id,
                type: "stack",
                x: Math.random() * 600 - 300,
                y: Math.random() * 400 - 200,
                radius: 150
            });
        }
    });

    let activeStackIds = new Set(stackNodes.map(s => s.id));

    function updateButton() {
        const shown = activeStackIds.size;
        const total = stackNodes.length;
        document.getElementById("stack-button").innerText = `Stacks ${shown}/${total}`;
    }

    function stackRigidCollision(padding = 10) {
        return function() {
            for (let i = 0; i < stackNodes.length; i++) {
                const a = stackNodes[i];
                if (!activeStackIds.has(a.id)) continue;
                const aBox = getStackBox(a);

                for (let j = i + 1; j < stackNodes.length; j++) {
                    const b = stackNodes[j];
                    if (!activeStackIds.has(b.id)) continue;
                    const bBox = getStackBox(b);

                    // Detectar superposición
                    const dx = bBox.cx - aBox.cx;
                    const dy = bBox.cy - aBox.cy;
                    const overlapX = (aBox.hw + bBox.hw + padding) - Math.abs(dx);
                    const overlapY = (aBox.hh + bBox.hh + padding) - Math.abs(dy);

                    if (overlapX > 0 && overlapY > 0) {
                        // Empujar en la dirección del eje mayor de intersección
                        if (overlapX > overlapY) {
                            const shift = overlapY / 2;
                            a.y -= shift * Math.sign(dy);
                            b.y += shift * Math.sign(dy);
                        } else {
                            const shift = overlapX / 2;
                            a.x -= shift * Math.sign(dx);
                            b.x += shift * Math.sign(dx);
                        }
                    }
                }
            }
        };
    }

    // Helper: calcula bounding box de stack basado en nodos
    function getStackBox(stack) {
        const children = nodes.filter(n => n.parent === stack.id);
        
        // Si no hay hijos, caja default centrada en el stack
        if (children.length === 0) {
            const r = stack.radius || 50;
            return { 
                x: stack.x - r, y: stack.y - r, w: r*2, h: r*2, // Coordenadas Top-Left y tamaño
                cx: stack.x, cy: stack.y, hw: r, hh: r          // Centro y mitades para colisiones
            };
        }

        // 1. Buscamos los límites extremos de los hijos
        const minX = d3.min(children, d => d.x - d.width/2);
        const maxX = d3.max(children, d => d.x + d.width/2);
        const minY = d3.min(children, d => d.y - d.height/2);
        const maxY = d3.max(children, d => d.y + d.height/2);

        const pad = 20; // Margen interno

        // 2. Definimos la caja basada estrictamente en esos límites
        const boxX = minX - pad;
        const boxY = minY - pad - 25; // Un poco más arriba para el título
        const boxW = (maxX - minX) + (pad * 2);
        const boxH = (maxY - minY) + (pad * 2) + 25;

        return {
            x: boxX,        // Coordenada izquierda absoluta
            y: boxY,        // Coordenada superior absoluta
            w: boxW,        // Ancho total
            h: boxH,        // Alto total
            cx: boxX + boxW/2, // El CENTRO VISUAL de la caja (puede no ser stack.x)
            cy: boxY + boxH/2, // El CENTRO VISUAL de la caja
            hw: boxW/2,     // Mitad del ancho
            hh: boxH/2      // Mitad del alto
        };
    }



    // ----------------------------
    // 2. SVG Y ZOOM LIMITADO
    // ----------------------------
    const w = window.innerWidth;
    const h = window.innerHeight;

    const svg = d3.select("#graph").append("svg")
        .attr("viewBox", [-w/2, -h/2, w, h]);

    const g = svg.append("g");

    svg.call(d3.zoom()
        .scaleExtent([0.1, 3]) // Zoom mínimo y máximo
        .on("zoom", e => g.attr("transform", e.transform))
    );

    const groupLayer = g.append("g");
    const nodeLayer = g.append("g");

    const bounds = { xMin: -5000, xMax: 5000, yMin: -5000, yMax: 5000 };

    const boundsRect = g.append("rect")
        .attr("x", bounds.xMin)
        .attr("y", bounds.yMin)
        .attr("width", bounds.xMax - bounds.xMin)
        .attr("height", bounds.yMax - bounds.yMin)
        .attr("fill", "none")           // Sin relleno
        .attr("stroke", "#FF5733")      // Color del borde
        .attr("stroke-width", 2)
        .attr("stroke-dasharray", "6 4") // opcional: línea punteada
        .lower(); // Para que quede debajo de los nodos y stacks

    // ----------------------------
    // 3. SIMULACION
    // ----------------------------
    const simulation = d3.forceSimulation([...stackNodes, ...nodes])
        // .force("charge", d3.forceManyBody().strength(d =>
        //     d.type === "stack" ? -3000 : -80
        // ))
        .velocityDecay(0.2)
        .force("collide", d3.forceCollide()
            .radius(d => d.type === "stack" ? 0 : d.collisionRadius)
            .iterations(3)
        )
        // .force("center", d3.forceCenter(0, 0))
        .force("containment", containmentForce())
        .force("parentFollow", parentFollowsChildren())
        .force("bounds", boundingBoxForce({
            xMin: bounds.xMin, xMax: bounds.xMax,
            yMin: bounds.yMin, yMax: bounds.yMax
        }))
        //.force("stackRigid", stackRigidCollision(5))
        // .force("heavyAnchor", heavyStackFriction())
        // .force("heavyStacks", () => {
        //      stackNodes.forEach(d => {
        //          // Multiplicamos por 0.5 en cada frame (freno de mano muy fuerte)
        //          d.vx *= 0.9; 
        //          d.vy *= 0.9;
        //      });
        // })
        .force("smartFriction", () => {
             stackNodes.forEach(s => {
                 // ¿Hay algún hijo de este stack siendo arrastrado?
                 // Buscamos si algún nodo hijo tiene fx definido (está bajo el ratón)
                 const isBeingDragged = nodes.some(n => n.parent === s.id && n.fx != null);

                 if (isBeingDragged) {
                     // MODO ARRASTRE: Fricción muy baja (0.95). 
                     // Deja que el stack coja velocidad y persiga al nodo.
                     s.vx *= 0.95;
                     s.vy *= 0.95;
                 } else {
                     // MODO REPOSO: Fricción alta (0.6).
                     // Evita que se muevan solos.
                     s.vx *= 0.6;
                     s.vy *= 0.6;
                 }
             });
        })
        .on("tick", ticked);

    // ----------------------------
    // 4. RENDER STACKS Y NODOS
    // ----------------------------
    let groupSel = groupLayer.selectAll(".group")
        .data(stackNodes, d=>d.id)
        .enter().append("g")
        .attr("class","group")
        .call(d3.drag()
            .on("start", dragStart)
            .on("drag", dragged)
            .on("end", dragEnd)
        );

    groupSel.append("rect").attr("class", "group-rect");
    groupSel.append("text").attr("class", "group-label").text(d=>d.id);

    let nodeSel = nodeLayer.selectAll(".node")
        .data(nodes, d=>d.id)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragStart)
            .on("drag", dragged)
            .on("end", dragEnd)
        );

    nodeSel.append("rect")
        .attr("width", d=>d.width)
        .attr("height", d=>d.height)
        .attr("x", d=>-d.width/2)
        .attr("y", d=>-d.height/2);

    nodeSel.append("text").text(d=>d.label);

    // ----------------------------
    // 5. TICK
    // ----------------------------
    function solveStrictCollisions() {
        const iterations = 3; 
        const padding = 0; 

        for (let k = 0; k < iterations; k++) {
            for (let i = 0; i < stackNodes.length; i++) {
                const a = stackNodes[i];
                if (!activeStackIds.has(a.id)) continue;
                
                // Recalculamos caja A (importante: basada en la posición actual de a)
                // NOTA: getStackBox depende de los nodos hijos, lo cual es peligroso aquí.
                // MEJOR: Usamos las coordenadas del stack 'a' y su tamaño actual guardado.
                // Para eso, asegúrate de guardar a.width y a.height en el ticked antes de llamar a esto.
                // O, simplificando, usamos getStackBox pero asumimos que el centro es a.x, a.y
                
                // Vamos a simplificar: Usamos a.x/a.y como la verdad absoluta del centro del stack
                // Asumimos que el radio/tamaño ya se calculó en el frame anterior o al inicio del tick.
                
                let aBox = getStackBox(a); 

                for (let j = i + 1; j < stackNodes.length; j++) {
                    const b = stackNodes[j];
                    if (!activeStackIds.has(b.id)) continue;
                    let bBox = getStackBox(b);

                    // A veces getStackBox calcula el centro basado en hijos promedio.
                    // Forzamos que el centro de la caja sea la coordenada x,y del objeto Stack
                    // para tener control total del movimiento.
                    // aBox.cx = a.x; aBox.cy = a.y;
                    // bBox.cx = b.x; bBox.cy = b.y;

                    const dx = bBox.cx - aBox.cx;
                    const dy = bBox.cy - aBox.cy;
                    const combinedHalfWidth = aBox.hw + bBox.hw + padding;
                    const combinedHalfHeight = aBox.hh + bBox.hh + padding;

                    if (Math.abs(dx) < combinedHalfWidth && Math.abs(dy) < combinedHalfHeight) {
                        const overlapX = combinedHalfWidth - Math.abs(dx);
                        const overlapY = combinedHalfHeight - Math.abs(dy);

                        let moveX = 0, moveY = 0;

                        if (overlapX < overlapY) {
                            const dir = Math.sign(dx) || 1;
                            moveX = (overlapX / 2) * dir;
                        } else {
                            const dir = Math.sign(dy) || 1;
                            moveY = (overlapY / 2) * dir;
                        }

                        // --- APLICAR CORRECCIÓN ---
                        
                        // 1. Mover Stack A (Hacia atrás)
                        if (moveX !== 0) a.x -= moveX;
                        if (moveY !== 0) a.y -= moveY;
                        a.vx = 0; a.vy = 0;

                        // 2. MOVER HIJOS DE A (CRUCIAL)
                        // Si movemos el stack, movemos sus hijos la misma distancia
                        moveChildren(a.id, -moveX, -moveY);

                        // 3. Mover Stack B (Hacia adelante)
                        if (moveX !== 0) b.x += moveX;
                        if (moveY !== 0) b.y += moveY;
                        b.vx = 0; b.vy = 0;

                        // 4. MOVER HIJOS DE B (CRUCIAL)
                        moveChildren(b.id, moveX, moveY);
                    }
                }
            }
        }
    }

    // Helper para mover a los hijos manualmente
    function moveChildren(parentId, dx, dy) {
        if (dx === 0 && dy === 0) return;
        nodes.forEach(n => {
            if (n.parent === parentId) {
                n.x += dx;
                n.y += dy;
                // También matamos su velocidad relativa para evitar rebotes internos
                n.vx = 0; 
                n.vy = 0;
            }
        });
    }

    function ticked() {
        // 1. Resolver colisiones (Mueve Stacks y Hijos solidariamente)
        solveStrictCollisions();

        // 2. Pintar Stacks
        groupSel.attr("display", d => activeStackIds.has(d.id) ? null : "none");
        
        groupSel.filter(d => activeStackIds.has(d.id)).each(function(d) {
            const box = getStackBox(d);
            
            // Movemos el grupo <g> a la posición física del stack (el ancla)
            d3.select(this).attr("transform", `translate(${d.x}, ${d.y})`);
            
            // Dibujamos el rectángulo RELATIVO a esa ancla.
            // Si box.x es 100 y d.x es 120, dibujamos en -20.
            d3.select(this).select("rect")
                .attr("x", box.x - d.x) 
                .attr("y", box.y - d.y)
                .attr("width", box.w)
                .attr("height", box.h);

            d3.select(this).select("text")
                .attr("x", (box.x - d.x) + 10) // Un poco a la derecha del borde izquierdo
                .attr("y", (box.y - d.y) + 20)
                .attr("text-anchor", "start"); // Alineamos texto a la izquierda
        });

        // 3. Pintar Nodos
        nodeSel.attr("display", d => activeStackIds.has(d.parent) ? null : "none");
        nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    }

    // ----------------------------
    // 6. FUERZAS
    // ----------------------------
    function containmentForce() {
        return function(alpha) {
            stackNodes.forEach(stack => {
                const children = nodes.filter(n=>n.parent===stack.id);
                const k = alpha*0.3;
                children.forEach(n=>{
                    n.vx += (stack.x - n.x)*k;
                    n.vy += (stack.y - n.y)*k;
                });
            });
        };
    }

    function boundingBoxForce(bounds) {
        return function(alpha) {
            const k = alpha*0.5;
            [...stackNodes, ...nodes].forEach(d=>{
                if(d.x < bounds.xMin) d.vx += (bounds.xMin-d.x)*k;
                if(d.x > bounds.xMax) d.vx += (bounds.xMax-d.x)*k;
                if(d.y < bounds.yMin) d.vy += (bounds.yMin-d.y)*k;
                if(d.y > bounds.yMax) d.vy += (bounds.yMax-d.y)*k;
            });
        };
    }

    function heavyStackFriction() {
        return function() {
            stackNodes.forEach(s => {
                // Si el usuario NO lo está arrastrando actualmente
                if (s.fx === null) {
                    s.vx *= 0.02; // Frena el 98% de la velocidad en cada tick
                    s.vy *= 0.02; 
                }
            });
        };
    }

    function parentFollowsChildren() {
        return function(alpha) {
            // Fuerza base fuerte
            const strength = 0.3; 
            
            stackNodes.forEach(stack => {
                if (stack.fx !== null || !activeStackIds.has(stack.id)) return;

                const children = nodes.filter(n => n.parent === stack.id);
                if (children.length === 0) return;

                // 1. Detectar si estamos en medio de una interacción
                // Si alpha es alto (>0.1) o hay drag, aplicamos fuerza completa.
                // Si la simulación se está apagando, suavizamos.
                let k = strength;
                if (alpha < 0.1) k = strength * alpha * 5; // Suavizado final

                // 2. Calcular Centro de Masas de los hijos
                let sumX = 0, sumY = 0;
                children.forEach(c => {
                    sumX += c.x;
                    sumY += c.y;
                });
                const targetX = sumX / children.length;
                const targetY = sumY / children.length;

                // 3. Empujar al stack hacia el centro de sus hijos
                stack.vx += (targetX - stack.x) * k;
                stack.vy += (targetY - stack.y) * k;
            });
        };
    }

    // ----------------------------
    // 7. DRAG
    // ----------------------------
    function dragStart(e,d){ simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; }
    function dragged(e, d) {
        // Si arrastramos un Stack, movemos a sus hijos manualmente
        // Esto evita el efecto "gelatina" que causa rebotes
        if (d.type === "stack") {
            const dx = e.x - d.x;
            const dy = e.y - d.y;
            
            // Movemos los hijos instantáneamente con el padre
            nodes.forEach(n => {
                if (n.parent === d.id) {
                    n.x += dx;
                    n.y += dy;
                    n.vx = 0; // Matamos su inercia para que no reboten
                    n.vy = 0;
                }
            });
        }

        d.fx = e.x;
        d.fy = e.y;
    }
    function dragEnd(e, d) {
        // Al soltar, no dejamos que alpha caiga a 0 inmediatamente.
        // Mantenemos un target bajo (0) pero reiniciamos con un alpha 
        // suficiente (0.3) para que dé tiempo a reajustar la forma.
        if (!e.active) simulation.alphaTarget(0);
        
        // Si lo que soltamos fue un nodo hijo, le damos un "empujón" a la simulación
        // para asegurar que vuelva a su sitio y el stack se encoja.
        if (d.type !== "stack") {
            simulation.alpha(0.3).restart();
        }
        
        d.fx = null;
        d.fy = null;
    }

    // ----------------------------
    // 8. PANEL DE STACKS
    // ----------------------------
    const button = document.getElementById("stack-button");
    const panel = document.getElementById("stack-panel");

    button.addEventListener("click", ()=>panel.style.display = panel.style.display==="block"?"none":"block");

    Object.keys(stacks).sort().forEach(stackId=>{
        const div = document.createElement("div");
        div.className="stack-item";
        div.innerHTML = `<label><input type="checkbox" checked value="${stackId}"> ${stackId}</label>`;
        panel.appendChild(div);

        div.querySelector("input").addEventListener("change", e=>{
            if(e.target.checked) activeStackIds.add(stackId);
            else activeStackIds.delete(stackId);
            updateButton();
        });
    });

    updateButton();

} catch(err){
    console.error(err);
}
</script>
</body>
</html>
