<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stacks "Always-On" con Dependencias</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* --- ESTILOS GENERALES --- */
html, body { margin:0; width:100%; height:100%; background:#1e1e1e; font-family:Segoe UI, sans-serif; overflow:hidden;}
svg { width:100%; height:100%; }

/* Estilos de Stacks y Nodos */
.group-rect { fill: rgba(255,255,255,0.04); stroke: #aaa; stroke-width: 2; stroke-dasharray: 6 3; rx:12; }
.group-label { fill:#aaa; font-size:13px; font-weight:bold; }
.node rect { fill:#3c3c3c; stroke:#000; rx:4; }
.node text { fill:#eee; font-size:11px; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }

/* Estilos de Enlaces (Dependencias) */
.link { stroke: #666; stroke-width: 1.5px; opacity: 0.6; pointer-events: none; }
#arrowhead { fill: #666; }

/* --- PANEL FLOTANTE --- */
#ui-controls {
    position: absolute; top: 20px; right: 20px; width: 220px;
    background: #2d2d2d; border: 1px solid #444; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); color: #eee; font-size: 13px;
    z-index: 1000; overflow: hidden;
}
.ui-header {
    padding: 12px 15px; background: #383838; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: bold; user-select: none;
}
.ui-header:hover { background: #444; }
.ui-content { display: none; max-height: 400px; overflow-y: auto; padding: 10px; border-top: 1px solid #444; }
.ui-content.open { display: block; }
.ui-row { display: flex; align-items: center; margin-bottom: 8px; }
.ui-row:last-child { margin-bottom: 0; }
.ui-row input { margin-right: 10px; cursor: pointer; }
.ui-row label { cursor: pointer; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<div id="ui-controls">
    <div class="ui-header" id="ui-header">
        <span id="ui-title">Stacks</span>
        <span id="ui-arrow">▼</span>
    </div>
    <div class="ui-content" id="ui-list"></div>
</div>

<div id="graph"></div>

<script>
// ----------------------
// 0. Helpers Texto
// ----------------------
function measureText(text, fontSize = 11, fontFamily = "Segoe UI") {
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${fontSize}px ${fontFamily}`;
    return ctx.measureText(text).width;
}

function wrapText(node, text, maxWidth = 120, fontSize = 11, padding = 6){
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(word=>{
        const testLine = line ? line + " " + word : word;
        if(measureText(testLine, fontSize) + padding*2 > maxWidth && line){
            lines.push(line);
            line = word;
        } else line = testLine;
    });
    if(line) lines.push(line);

    node.width = Math.max(maxWidth, d3.max(lines.map(l=>measureText(l, fontSize))) + padding*2);
    node.height = lines.length * (fontSize + 2) + padding*2;
    node.collisionRadius = Math.sqrt(node.width*node.width + node.height*node.height)/2;
    return lines;
}

// ----------------------
// 1. Datos
// ----------------------
const rawData = {{graphData}};

const nodes = [];
const stackNodes = [];
const stacks = {};
const links = []; // Array para guardar las conexiones

// A. Procesar Nodos
rawData.nodes.forEach(n=>{
    const d = n.data;
    if(d.parent){
        const node = {
            id:d.id,
            label:d.label||d.id,
            parent:d.parent,
            x: Math.random()*600-300,
            y: Math.random()*400-200,
            vx:0, vy:0, fx:null, fy:null
        };
        wrapText(node, node.label, 120);
        nodes.push(node);
        if(!stacks[d.parent]) stacks[d.parent]=[];
        stacks[d.parent].push(node);
    } else {
        stackNodes.push({
            id:d.id,
            label: d.label || d.id,
            x:Math.random()*600-300,
            y:Math.random()*400-200,
            fx:null, fy:null,
            isDragging: false,
            nodeSim:null,
            visible: true 
        });
    }
});

// B. Procesar Dependencias (Edges)
if(rawData.edges){
    rawData.edges.forEach(e => {
        const d = e.data;
        // Buscamos los objetos nodo reales
        const sourceNode = nodes.find(n => n.id === d.source);
        const targetNode = nodes.find(n => n.id === d.target);

        if(sourceNode && targetNode){
            links.push({
                id: d.id,
                source: sourceNode,
                target: targetNode
            });
        }
    });
}

// ----------------------
// 2. Helpers Stacks
// ----------------------
function getStackBox(stack){
    const children = stacks[stack.id] || [];
    if(!children.length) return {x:stack.x-50,y:stack.y-50,w:100,h:100};
    const minX = d3.min(children,d=>d.x-d.width/2);
    const maxX = d3.max(children,d=>d.x+d.width/2);
    const minY = d3.min(children,d=>d.y-d.height/2);
    const maxY = d3.max(children,d=>d.y+d.height/2);
    const pad = 25; 
    return {x:minX-pad, y:minY-pad-20, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2+20};
}

// ----------------------
// 3. Simulación interna
// ----------------------
stackNodes.forEach(stack=>{
    const children = stacks[stack.id] || [];
    stack.nodeSim = d3.forceSimulation(children)
        .force("collide", d3.forceCollide()
            .radius(d=>d.collisionRadius + 1)
            .strength(1)
            .iterations(2))
        .alphaDecay(0) 
        .alpha(0.1) 
        .velocityDecay(0.9);
});

// ----------------------
// 4. SVG y Capas
// ----------------------
const w = window.innerWidth;
const h = window.innerHeight;
const svg = d3.select("#graph").append("svg").attr("viewBox",[-w/2,-h/2,w,h]);

// Definición de flecha (marker)
svg.append("defs").append("marker")
    .attr("id", "arrowhead")
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 10) // Ajuste para que no quede debajo del rect (se ajustará en lógica o CSS)
    .attr("refY", 0)
    .attr("markerWidth", 6)
    .attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5");

const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1,4]).on("zoom",e=>g.attr("transform",e.transform)));

// ORDEN DE CAPAS: Stacks (Fondo) -> Links (Medio) -> Nodos (Frente)
const groupLayer = g.append("g");
const linkLayer = g.append("g"); // <--- NUEVA CAPA
const nodeLayer = g.append("g");

// --- STACKS ---
const groupSel = groupLayer.selectAll(".group").data(stackNodes).enter().append("g")
    .attr("class","group")
    .call(d3.drag()
        .on("start", (e,d)=>{
            if(!d.visible) return;
            d.fx=d.x; d.fy=d.y; 
            d.isDragging = true;
        })
        .on("drag", (e,d)=>{
            if(!d.visible) return;
            const dx = e.x - d.x;
            const dy = e.y - d.y;
            d.x += dx; d.y += dy;
            (stacks[d.id]||[]).forEach(n=>{ n.x+=dx; n.y+=dy; });
        })
        .on("end", (e,d)=>{
            d.fx=null; d.fy=null; d.isDragging = false;
        })
    );

groupSel.append("rect").attr("class","group-rect");
groupSel.append("text").attr("class","group-label").text(d=>d.id);

// --- LINKS (DEPENDENCIAS) ---
const linkSel = linkLayer.selectAll(".link")
    .data(links)
    .enter().append("line")
    .attr("class", "link")
    .attr("marker-end", "url(#arrowhead)"); // Añadir flecha

// --- NODOS ---
const nodeSel = nodeLayer.selectAll(".node").data(nodes).enter().append("g")
    .attr("class","node")
    .call(d3.drag()
        .on("start",(e,d)=>{ 
            const parent = stackNodes.find(s=>s.id===d.parent);
            if(parent && !parent.visible) return;
            d.fx=d.x; d.fy=d.y; 
            if(parent) parent.isDragging = true;
        })
        .on("drag",(e,d)=>{
            const parent = stackNodes.find(s=>s.id===d.parent);
            if(parent && !parent.visible) return;
            d.fx = e.x; d.fy = e.y;
            if(parent){
                const influence = 0.2; 
                parent.x += (e.x - parent.x) * influence;
                parent.y += (e.y - parent.y) * influence;
            }
        })
        .on("end",(e,d)=>{ 
            d.fx=null; d.fy=null; 
            const parent = stackNodes.find(s=>s.id===d.parent);
            if(parent) parent.isDragging = false;
        })
    );

nodeSel.append("rect").attr("x",d=>-d.width/2).attr("y",d=>-d.height/2).attr("width",d=>d.width).attr("height",d=>d.height);
nodeSel.append("text").each(function(d){
    const lines = wrapText(d,d.label, 120);
    d3.select(this).selectAll("*").remove();
    const lineHeight = 11 + 2; 
    const totalHeight = lines.length * lineHeight;
    lines.forEach((line,i)=>{
        d3.select(this).append("tspan").text(line)
            .attr("x",0)
            .attr("y", -totalHeight/2 + lineHeight/2 + i*lineHeight); 
    });
});

// ----------------------
// 5. UI Logic
// ----------------------
function updateUIHeader() {
    const total = stackNodes.length;
    const visible = stackNodes.filter(s => s.visible).length;
    document.getElementById("ui-title").innerText = `Stacks ${visible}/${total}`;
}

function updateVisibility(stackId, isVisible) {
    // 1. Modelo
    const stack = stackNodes.find(s => s.id === stackId);
    if(stack) stack.visible = isVisible;

    // 2. Visuales Stacks y Nodos
    groupSel.filter(d => d.id === stackId).style("display", isVisible ? "inline" : "none");
    nodeSel.filter(d => d.parent === stackId).style("display", isVisible ? "inline" : "none");

    // 3. Visuales Links (Lógica Cruzada)
    // Un link se ve SOLO si el stack origen Y el stack destino son visibles
    linkSel.style("display", l => {
        const sParent = stackNodes.find(st => st.id === l.source.parent);
        const tParent = stackNodes.find(st => st.id === l.target.parent);
        if(sParent && tParent && sParent.visible && tParent.visible){
            return "inline";
        }
        return "none";
    });

    updateUIHeader();
}

function initUI() {
    const list = document.getElementById("ui-list");
    const header = document.getElementById("ui-header");
    header.addEventListener("click", () => {
        list.classList.toggle("open");
        document.getElementById("ui-arrow").innerText = list.classList.contains("open") ? "▲" : "▼";
    });

    stackNodes.forEach(s => {
        const row = document.createElement("div"); row.className = "ui-row";
        const chk = document.createElement("input"); chk.type = "checkbox"; chk.checked = s.visible; chk.id = "chk-" + s.id;
        chk.addEventListener("change", (e) => updateVisibility(s.id, e.target.checked));
        const lbl = document.createElement("label"); lbl.htmlFor = "chk-" + s.id; lbl.innerText = s.label || s.id;
        row.appendChild(chk); row.appendChild(lbl); list.appendChild(row);
    });
    updateUIHeader();
}
initUI();

// ----------------------
// 6. Tick Loop
// ----------------------
function ticked(){
    // A. Física Stacks Interna
    stackNodes.forEach(stack=>{
        if(!stack.visible) return;
        if(stack.nodeSim) stack.nodeSim.tick();

        const children = stacks[stack.id] || [];
        if(children.length){
            const equilibriumRadius = Math.sqrt(children.length) * 45;
            children.forEach(n => {
                const dx = stack.x - n.x, dy = stack.y - n.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > equilibriumRadius) {
                    const overlap = dist - equilibriumRadius;
                    n.vx += (dx / dist) * overlap * 0.05;
                    n.vy += (dy / dist) * overlap * 0.05;
                }
            });
            const cx = d3.mean(children,d=>d.x), cy = d3.mean(children,d=>d.y);
            if(!stack.isDragging) {
                stack.x += (cx - stack.x) * 0.1;
                stack.y += (cy - stack.y) * 0.1;
            }
        }
    });

    // B. Colisiones Stacks
    const paddingStack = 30;
    for(let i=0;i<stackNodes.length;i++){
        const a = stackNodes[i];
        if(!a.visible) continue;
        const aBox = getStackBox(a);
        const acx = aBox.x + aBox.w/2, acy = aBox.y + aBox.h/2;
        
        for(let j=i+1;j<stackNodes.length;j++){
            const b = stackNodes[j];
            if(!b.visible) continue;
            const bBox = getStackBox(b);
            const bcx = bBox.x + bBox.w/2, bcy = bBox.y + bBox.h/2;
            const dx = bcx - acx, dy = bcy - acy;
            const ox = (aBox.w + bBox.w)/2 + paddingStack - Math.abs(dx);
            const oy = (aBox.h + bBox.h)/2 + paddingStack - Math.abs(dy);
            
            if(ox>0 && oy>0){
                let moveA = 0.5, moveB = 0.5;
                if(a.isDragging && !b.isDragging) { moveA = 0; moveB = 1; }
                else if(!a.isDragging && b.isDragging) { moveA = 1; moveB = 0; }
                
                if(ox<oy){
                    const sx = Math.sign(dx)*ox;
                    a.x -= sx * moveA; (stacks[a.id]||[]).forEach(n=>{ n.x-=sx*moveA; });
                    b.x += sx * moveB; (stacks[b.id]||[]).forEach(n=>{ n.x+=sx*moveB; });
                } else {
                    const sy = Math.sign(dy)*oy;
                    a.y -= sy * moveA; (stacks[a.id]||[]).forEach(n=>{ n.y-=sy*moveA; });
                    b.y += sy * moveB; (stacks[b.id]||[]).forEach(n=>{ n.y+=sy*moveB; });
                }
            }
        }
    }

    // C. Render Stacks
    groupSel.each(function(d){
        if(!d.visible) return;
        const box = getStackBox(d);
        d3.select(this).attr("transform",`translate(${d.x},${d.y})`)
            .select("rect").attr("x",box.x-d.x).attr("y",box.y-d.y).attr("width",box.w).attr("height",box.h);
        d3.select(this).select("text").attr("x",(box.x-d.x)+10).attr("y",(box.y-d.y)+20);
    });

    // D. Render Links (Simplemente unir source y target)
    linkSel
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

    // E. Render Nodos
    nodeSel
        .filter(d => { const p = stackNodes.find(s=>s.id === d.parent); return p && p.visible; })
        .attr("transform", d=>`translate(${d.x},${d.y})`);

    requestAnimationFrame(ticked);
}

ticked();
</script>
</body>
</html>
