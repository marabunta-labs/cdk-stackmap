<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stacks "Always-On" con UI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* --- ESTILOS GENERALES --- */
html, body { margin:0; width:100%; height:100%; background:#1e1e1e; font-family:Segoe UI, sans-serif; overflow:hidden;}
svg { width:100%; height:100%; }
.group-rect { fill: rgba(255,255,255,0.04); stroke: #aaa; stroke-width: 2; stroke-dasharray: 6 3; rx:12; }
.group-label { fill:#aaa; font-size:13px; font-weight:bold; }
.node rect { fill:#3c3c3c; stroke:#000; rx:4; }
.node text { fill:#eee; font-size:11px; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }

/* --- NUEVOS ESTILOS PARA EL PANEL FLOTANTE --- */
#ui-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 220px;
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    color: #eee;
    font-size: 13px;
    z-index: 1000;
    overflow: hidden;
}

.ui-header {
    padding: 12px 15px;
    background: #383838;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    user-select: none;
}

.ui-header:hover {
    background: #444;
}

.ui-content {
    display: none; /* Oculto por defecto */
    max-height: 400px;
    overflow-y: auto;
    padding: 10px;
    border-top: 1px solid #444;
}

.ui-content.open {
    display: block;
}

.ui-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.ui-row:last-child {
    margin-bottom: 0;
}

.ui-row input {
    margin-right: 10px;
    cursor: pointer;
}

.ui-row label {
    cursor: pointer;
    flex-grow: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>
</head>
<body>

<div id="ui-controls">
    <div class="ui-header" id="ui-header">
        <span id="ui-title">Stacks</span>
        <span id="ui-arrow">▼</span>
    </div>
    <div class="ui-content" id="ui-list">
        </div>
</div>

<div id="graph"></div>

<script>
// ----------------------
// 0. Helpers
// ----------------------
function measureText(text, fontSize = 11, fontFamily = "Segoe UI") {
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${fontSize}px ${fontFamily}`;
    return ctx.measureText(text).width;
}

function wrapText(node, text, maxWidth = 120, fontSize = 11, padding = 6){
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(word=>{
        const testLine = line ? line + " " + word : word;
        if(measureText(testLine, fontSize) + padding*2 > maxWidth && line){
            lines.push(line);
            line = word;
        } else line = testLine;
    });
    if(line) lines.push(line);

    node.width = Math.max(maxWidth, d3.max(lines.map(l=>measureText(l, fontSize))) + padding*2);
    node.height = lines.length * (fontSize + 2) + padding*2;
    node.collisionRadius = Math.sqrt(node.width*node.width + node.height*node.height)/2;
    return lines;
}

// ----------------------
// 1. Datos
// ----------------------
const rawData = {{graphData}};

const nodes = [];
const stackNodes = [];
const stacks = {};

rawData.nodes.forEach(n=>{
    const d = n.data;
    if(d.parent){
        const node = {
            id:d.id,
            label:d.label||d.id,
            parent:d.parent,
            x: Math.random()*600-300,
            y: Math.random()*400-200,
            vx:0, vy:0, fx:null, fy:null
        };
        wrapText(node, node.label, 120);
        nodes.push(node);
        if(!stacks[d.parent]) stacks[d.parent]=[];
        stacks[d.parent].push(node);
    } else {
        stackNodes.push({
            id:d.id,
            label: d.label || d.id, // Asegurar etiqueta para el UI
            x:Math.random()*600-300,
            y:Math.random()*400-200,
            fx:null, fy:null,
            isDragging: false,
            nodeSim:null,
            visible: true // <--- PROPIEDAD NUEVA PARA EL TOGGLE
        });
    }
});

// ----------------------
// 2. Helpers
// ----------------------
function getStackBox(stack){
    const children = stacks[stack.id] || [];
    if(!children.length) return {x:stack.x-50,y:stack.y-50,w:100,h:100};
    const minX = d3.min(children,d=>d.x-d.width/2);
    const maxX = d3.max(children,d=>d.x+d.width/2);
    const minY = d3.min(children,d=>d.y-d.height/2);
    const maxY = d3.max(children,d=>d.y+d.height/2);
    const pad = 25; 
    return {x:minX-pad, y:minY-pad-20, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2+20};
}

// ----------------------
// 3. Simulación interna
// ----------------------
stackNodes.forEach(stack=>{
    const children = stacks[stack.id] || [];
    stack.nodeSim = d3.forceSimulation(children)
        .force("collide", d3.forceCollide()
            .radius(d=>d.collisionRadius + 1)
            .strength(1)
            .iterations(2))
        .alphaDecay(0) 
        .alpha(0.1) 
        .velocityDecay(0.9);
});

// ----------------------
// 4. SVG y DRAG
// ----------------------
const w = window.innerWidth;
const h = window.innerHeight;
const svg = d3.select("#graph").append("svg").attr("viewBox",[-w/2,-h/2,w,h]);
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1,4]).on("zoom",e=>g.attr("transform",e.transform)));

const groupLayer = g.append("g");
const nodeLayer = g.append("g");

// --- STACKS (CAJAS) ---
const groupSel = groupLayer.selectAll(".group").data(stackNodes).enter().append("g")
    .attr("class","group")
    .attr("id", d => "stack-group-" + d.id) // ID para control visual fácil
    .call(d3.drag()
        .on("start", (e,d)=>{
            if(!d.visible) return; // No arrastrar si invisible
            d.fx=d.x; d.fy=d.y; 
            d.isDragging = true;
        })
        .on("drag", (e,d)=>{
            if(!d.visible) return;
            const dx = e.x - d.x;
            const dy = e.y - d.y;
            d.x += dx; d.y += dy;
            (stacks[d.id]||[]).forEach(n=>{ n.x+=dx; n.y+=dy; });
        })
        .on("end", (e,d)=>{
            d.fx=null; d.fy=null; 
            d.isDragging = false;
        })
    );

groupSel.append("rect").attr("class","group-rect");
groupSel.append("text").attr("class","group-label").text(d=>d.id);

// --- NODOS ---
const nodeSel = nodeLayer.selectAll(".node").data(nodes).enter().append("g")
    .attr("class","node")
    .attr("data-parent", d => d.parent) // Data attribute para filtrar visualmente
    .call(d3.drag()
        .on("start",(e,d)=>{ 
            const parent = stackNodes.find(s=>s.id===d.parent);
            if(parent && !parent.visible) return; // Bloquear si invisible
            
            d.fx=d.x; d.fy=d.y; 
            if(parent) parent.isDragging = true;
        })
        .on("drag",(e,d)=>{
            const parent = stackNodes.find(s=>s.id===d.parent);
            if(parent && !parent.visible) return;

            d.fx = e.x; d.fy = e.y;
            if(parent){
                const influence = 0.2; 
                parent.x += (e.x - parent.x) * influence;
                parent.y += (e.y - parent.y) * influence;
            }
        })
        .on("end",(e,d)=>{ 
            d.fx=null; d.fy=null; 
            const parent = stackNodes.find(s=>s.id===d.parent);
            if(parent) parent.isDragging = false;
        })
    );

nodeSel.append("rect").attr("x",d=>-d.width/2).attr("y",d=>-d.height/2).attr("width",d=>d.width).attr("height",d=>d.height);
nodeSel.append("text").each(function(d){
    const lines = wrapText(d,d.label, 120);
    d3.select(this).selectAll("*").remove();
    const lineHeight = 11 + 2; 
    const totalHeight = lines.length * lineHeight;
    lines.forEach((line,i)=>{
        d3.select(this).append("tspan").text(line)
            .attr("x",0)
            .attr("y", -totalHeight/2 + lineHeight/2 + i*lineHeight); 
    });
});

// ----------------------
// 5. Lógica del UI Flotante
// ----------------------
function updateUIHeader() {
    const total = stackNodes.length;
    const visible = stackNodes.filter(s => s.visible).length;
    document.getElementById("ui-title").innerText = `Stacks ${visible}/${total}`;
}

function updateVisibility(stackId, isVisible) {
    // 1. Actualizar modelo de datos
    const stack = stackNodes.find(s => s.id === stackId);
    if(stack) stack.visible = isVisible;

    // 2. Actualizar visualización SVG
    // Ocultar grupo del stack
    groupSel.filter(d => d.id === stackId)
        .style("display", isVisible ? "inline" : "none");
    
    // Ocultar nodos hijos
    nodeSel.filter(d => d.parent === stackId)
        .style("display", isVisible ? "inline" : "none");

    // 3. Actualizar contador
    updateUIHeader();
}

function initUI() {
    const list = document.getElementById("ui-list");
    const header = document.getElementById("ui-header");
    
    // Toggle desplegable
    header.addEventListener("click", () => {
        list.classList.toggle("open");
        const arrow = document.getElementById("ui-arrow");
        arrow.innerText = list.classList.contains("open") ? "▲" : "▼";
    });

    // Generar checkboxes
    stackNodes.forEach(s => {
        const row = document.createElement("div");
        row.className = "ui-row";

        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.checked = s.visible;
        chk.id = "chk-" + s.id;
        
        chk.addEventListener("change", (e) => {
            updateVisibility(s.id, e.target.checked);
        });

        const lbl = document.createElement("label");
        lbl.htmlFor = "chk-" + s.id;
        lbl.innerText = s.label || s.id;
        lbl.title = s.label || s.id; // Tooltip para nombres largos

        row.appendChild(chk);
        row.appendChild(lbl);
        list.appendChild(row);
    });

    updateUIHeader();
}

// Iniciar UI
initUI();


// ----------------------
// 6. Tick Loop (Modificado para visibilidad)
// ----------------------
function ticked(){
    // 1. FÍSICA ETERNA
    stackNodes.forEach(stack=>{
        // Si no es visible, no calculamos sus físicas internas
        if(!stack.visible) return;

        if(stack.nodeSim) stack.nodeSim.tick();

        const children = stacks[stack.id] || [];
        if(children.length){
            const equilibriumRadius = Math.sqrt(children.length) * 45;

            children.forEach(n => {
                const dx = stack.x - n.x;
                const dy = stack.y - n.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if(dist > equilibriumRadius) {
                    const pullStrength = 0.05; 
                    const overlap = dist - equilibriumRadius;
                    const fx = (dx / dist) * overlap * pullStrength;
                    const fy = (dy / dist) * overlap * pullStrength;
                    n.vx += fx;
                    n.vy += fy;
                }
            });

            // Re-centrado
            const cx = d3.mean(children,d=>d.x);
            const cy = d3.mean(children,d=>d.y);
            
            if(!stack.isDragging) {
                stack.x += (cx - stack.x) * 0.1;
                stack.y += (cy - stack.y) * 0.1;
            }
        }
    });

    // Colisiones Stacks
    const paddingStack = 30;
    for(let i=0;i<stackNodes.length;i++){
        const a = stackNodes[i];
        if(!a.visible) continue; // Salta si A es invisible

        const aBox = getStackBox(a);
        const acx = aBox.x + aBox.w/2;
        const acy = aBox.y + aBox.h/2;
        
        for(let j=i+1;j<stackNodes.length;j++){
            const b = stackNodes[j];
            if(!b.visible) continue; // Salta si B es invisible

            const bBox = getStackBox(b);
            const bcx = bBox.x + bBox.w/2;
            const bcy = bBox.y + bBox.h/2;
            const dx = bcx - acx;
            const dy = bcy - acy;
            const ox = (aBox.w + bBox.w)/2 + paddingStack - Math.abs(dx);
            const oy = (aBox.h + bBox.h)/2 + paddingStack - Math.abs(dy);
            
            if(ox>0 && oy>0){
                let moveA = 0.5;
                let moveB = 0.5;

                if(a.isDragging && !b.isDragging) { moveA = 0; moveB = 1; }
                else if(!a.isDragging && b.isDragging) { moveA = 1; moveB = 0; }
                
                if(ox<oy){
                    const sx = Math.sign(dx)*ox;
                    const shiftA = sx * moveA;
                    const shiftB = sx * moveB;
                    a.x -= shiftA; (stacks[a.id]||[]).forEach(n=>{ n.x-=shiftA; });
                    b.x += shiftB; (stacks[b.id]||[]).forEach(n=>{ n.x+=shiftB; });
                } else {
                    const sy = Math.sign(dy)*oy;
                    const shiftA = sy * moveA;
                    const shiftB = sy * moveB;
                    a.y -= shiftA; (stacks[a.id]||[]).forEach(n=>{ n.y-=shiftA; });
                    b.y += shiftB; (stacks[b.id]||[]).forEach(n=>{ n.y+=shiftB; });
                }
            }
        }
    }

    // Actualizar SVG (Solo si es visible, aunque display:none ya maneja visuales)
    // Dejamos que actualice posiciones para que cuando reaparezca esté en su sitio actualizado
    groupSel.each(function(d){
        if(!d.visible) return; // Optimización ligera en render

        const box = getStackBox(d);
        d3.select(this)
            .attr("transform",`translate(${d.x},${d.y})`)
            .select("rect")
            .attr("x",box.x-d.x).attr("y",box.y-d.y)
            .attr("width",box.w).attr("height",box.h);
        d3.select(this).select("text")
            .attr("x",(box.x-d.x)+10)
            .attr("y",(box.y-d.y)+20);
    });

    nodeSel
        .filter(d => {
            const p = stackNodes.find(s=>s.id === d.parent);
            return p && p.visible;
        })
        .attr("transform", d=>`translate(${d.x},${d.y})`);

    requestAnimationFrame(ticked);
}

ticked();
</script>
</body>
</html>
